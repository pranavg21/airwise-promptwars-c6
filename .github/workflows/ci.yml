name: AirWise Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, tests and audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - name: Lint (complexity, naming, bugbear, imports)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Strict type check
        run: mypy
      - name: Tests with branch coverage
        run: python -m pytest -q --cov=airwise --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Planted bugs must be caught by the tests
        run: python -m scripts.mutation_check
      - name: Known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Repository size and secret scan
        run: python scripts/audit_repo.py
      - name: Single branch (competition rule)
        if: github.event_name == 'push'
        run: test "$(git ls-remote --heads origin | wc -l)" -eq 1

  frontend:
    name: Browser code lint, format, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (complexity, function and file size limits)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Strict type check of browser code
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Known vulnerabilities in tooling
        run: npm audit --audit-level=low

  browser:
    name: Desktop and mobile walkthrough with accessibility checks
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright==1.62.0 axe-playwright-python==0.1.8
      - run: python -m playwright install --with-deps chromium
      - name: User journeys at 1366 px and 390 px (synthetic data, mocked city search and Gemini)
        run: python -m scripts.browser_check
      - name: axe-core scans and keyboard walkthrough (mocked Gemini)
        run: python -m scripts.a11y_check
