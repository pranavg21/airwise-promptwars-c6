name: AirWise Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q airwise
      - run: python -m pytest -q --cov=airwise --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: python scripts/audit_repo.py
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_check
