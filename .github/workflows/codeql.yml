name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Static security analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: List findings in the log
        run: |
          python3 - <<'PY'
          import glob, json
          results = [r for path in glob.glob("codeql-results/*.sarif")
                     for run in json.load(open(path))["runs"] for r in run.get("results", [])]
          for r in results:
              where = r["locations"][0]["physicalLocation"]
              print(f'{r.get("level", "warning")} {r["ruleId"]} {where["artifactLocation"]["uri"]}:'
                    f'{where.get("region", {}).get("startLine")} {r["message"]["text"][:160]}')
          print(f"{len(results)} CodeQL findings")
          PY
