[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "N", "RUF", "PLE", "PLR", "PLW"]
# Unicode subscripts (PM₂.₅, CO₂) and µ are intentional in user-facing text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 6
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0913", "N802"]
# Browser walkthroughs are deliberately linear scripts of user steps.
"scripts/*" = ["PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.12"
files = ["airwise"]
strict = true
plugins = ["pydantic.mypy"]
